<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>おきにいりレシピ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Zen Maru Gothic', sans-serif;
  background: #fdf6f0;
  min-height: 100vh;
  overflow-x: hidden;
}
:root {
  --primary: #e8604a;
  --bg: #fdf6f0;
  --card: #ffffff;
  --text: #4a2c1e;
  --sub: #8b5e4a;
  --muted: #a08070;
  --border: #f0e4d8;
  --tag-bg: #fff0e8;
  --tag-color: #c0603e;
}
.bg-decor1 {
  position: fixed; top: -80px; right: -80px;
  width: 300px; height: 300px; border-radius: 50%;
  background: radial-gradient(circle, #ffe0cc 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}
.bg-decor2 {
  position: fixed; bottom: -60px; left: -60px;
  width: 250px; height: 250px; border-radius: 50%;
  background: radial-gradient(circle, #ffd6e8 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}
/* Toast */
#toast {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  background: #4caf82; color: #fff;
  padding: 10px 24px; border-radius: 24px;
  font-weight: 700; font-size: 14px;
  z-index: 9999; box-shadow: 0 4px 16px rgba(0,0,0,.15);
  display: none;
  animation: slideIn .3s ease;
}
@keyframes slideIn { from { opacity:0; transform:translateX(-50%) translateY(-12px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
@keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
/* Header */
header {
  background: rgba(255,255,255,.88);
  backdrop-filter: blur(8px);
  border-bottom: 1.5px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.header-inner {
  max-width: 600px; margin: 0 auto;
  padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
}
#back-btn {
  background: #f5ede6; border: none;
  border-radius: 10px; width: 36px; height: 36px;
  font-size: 18px; cursor: pointer; color: #8b6355;
  display: none; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.logo { display: flex; align-items: center; gap: 8px; flex: 1; }
.logo-emoji { font-size: 24px; }
.logo-text { font-size: 18px; font-weight: 700; color: #6b4226; }
#add-btn {
  background: var(--primary); color: #fff;
  border: none; border-radius: 20px;
  padding: 8px 18px; font-weight: 700;
  font-size: 14px; cursor: pointer;
  font-family: 'Zen Maru Gothic', sans-serif;
  box-shadow: 0 2px 8px rgba(232,96,74,.3);
  flex-shrink: 0; white-space: nowrap;
}
/* Main */
main {
  max-width: 600px; margin: 0 auto;
  padding: 16px 16px 80px;
  position: relative; z-index: 1;
}
/* Views */
.view { display: none; }
.view.active { display: block; animation: fadeUp .3s ease; }

/* Search */
.search-row { margin-bottom: 12px; }
#search-input {
  width: 100%; padding: 12px 16px;
  border: 1.5px solid var(--border);
  border-radius: 16px; font-size: 15px;
  background: #fff;
  font-family: 'Zen Maru Gothic', sans-serif;
  outline: none; color: var(--text);
  box-shadow: 0 2px 8px rgba(0,0,0,.04);
}
/* Tag filter */
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.tag-chip {
  padding: 5px 12px; border-radius: 20px;
  border: 1.5px solid #e8d4c4;
  background: #fff; color: #9a7060;
  font-size: 12px; font-weight: 500;
  cursor: pointer; font-family: 'Zen Maru Gothic', sans-serif;
  transition: all .15s;
}
.tag-chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }

/* Cards */
#card-grid { display: flex; flex-direction: column; gap: 10px; }
.card {
  background: #fff; border-radius: 18px; padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  border: 1.5px solid var(--border);
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,.04);
  transition: transform .15s, box-shadow .15s;
}
.card:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.08); }
.card-emoji { font-size: 28px; flex-shrink: 0; }
.card-body { flex: 1; min-width: 0; }
.card-name { font-weight: 700; font-size: 16px; color: var(--text); margin-bottom: 4px; }
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
.tag-badge {
  background: var(--tag-bg); color: var(--tag-color);
  border-radius: 10px; padding: 2px 8px; font-size: 11px; font-weight: 600;
}
.card-memo { font-size: 12px; color: var(--muted); line-height: 1.5; }
.card-date { font-size: 11px; color: #c0a090; margin-top: 4px; }
.card-arrow { font-size: 22px; color: #d0b0a0; flex-shrink: 0; }
.empty { text-align: center; padding: 60px 0; }
.empty p { color: var(--muted); margin-top: 8px; }

/* Detail */
.detail-card {
  background: #fff; border-radius: 24px;
  padding: 28px 24px;
  border: 1.5px solid var(--border);
  box-shadow: 0 4px 20px rgba(0,0,0,.06);
}
.detail-emoji { font-size: 48px; text-align: center; display: block; margin-bottom: 8px; }
.detail-name { font-size: 24px; font-weight: 700; color: var(--text); text-align: center; margin-bottom: 12px; }
.detail-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 20px; }
.detail-section { margin-bottom: 20px; }
.detail-label { font-weight: 700; color: var(--sub); font-size: 13px; margin-bottom: 6px; }
.detail-link {
  color: var(--primary); word-break: break-all;
  font-size: 14px; text-decoration: none;
  border-bottom: 1px dashed var(--primary);
}
.detail-memo {
  background: var(--bg); border-radius: 12px;
  padding: 12px 14px; font-size: 14px;
  color: #5a3e32; line-height: 1.7;
  white-space: pre-wrap;
  border: 1px solid var(--border);
}
.detail-date { font-size: 12px; color: #bfa090; margin-bottom: 20px; }
.detail-actions { display: flex; gap: 10px; }
.edit-btn {
  flex: 1; padding: 12px; border-radius: 14px;
  background: #fff5f0; border: 1.5px solid #e8d0c0;
  color: #a0603a; font-weight: 700; font-size: 14px;
  cursor: pointer; font-family: 'Zen Maru Gothic', sans-serif;
}
.delete-btn {
  flex: 1; padding: 12px; border-radius: 14px;
  background: #fff0f0; border: 1.5px solid #f0d0d0;
  color: #c05050; font-weight: 700; font-size: 14px;
  cursor: pointer; font-family: 'Zen Maru Gothic', sans-serif;
}

/* Form */
.form-card {
  background: #fff; border-radius: 24px;
  padding: 24px 20px;
  border: 1.5px solid var(--border);
  box-shadow: 0 4px 20px rgba(0,0,0,.06);
}
.form-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 20px; }
label { display: block; font-weight: 700; color: var(--sub); font-size: 13px; margin-bottom: 6px; }
.required { color: var(--primary); }
input[type=text], input[type=url], textarea {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid #f0e0d4; border-radius: 12px;
  font-size: 15px; margin-bottom: 16px;
  font-family: 'Zen Maru Gothic', sans-serif;
  color: var(--text); background: #fdfaf8;
  outline: none;
}
textarea { resize: vertical; line-height: 1.7; font-size: 14px; }
input::placeholder, textarea::placeholder { color: #c4b0a0; }
.tag-select-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
#save-btn {
  width: 100%; padding: 14px;
  background: var(--primary); color: #fff;
  border: none; border-radius: 16px;
  font-size: 16px; font-weight: 700;
  cursor: pointer; font-family: 'Zen Maru Gothic', sans-serif;
  box-shadow: 0 3px 12px rgba(232,96,74,.35);
  transition: opacity .2s;
}
#save-btn:disabled { background: #ddd; box-shadow: none; cursor: not-allowed; }
</style>
</head>
<body>

<div class="bg-decor1"></div>
<div class="bg-decor2"></div>
<div id="toast"></div>

<header>
  <div class="header-inner">
    <button id="back-btn" onclick="goBack()">←</button>
    <div class="logo">
      <span class="logo-emoji">🍳</span>
      <span class="logo-text">おきにいりレシピ</span>
    </div>
    <button id="add-btn" onclick="openAdd()">＋ 追加</button>
  </div>
</header>

<main>
  <!-- LIST -->
  <div id="view-list" class="view active">
    <div class="search-row">
      <input type="text" id="search-input" placeholder="🔍 レシピを検索…" oninput="renderList()">
    </div>
    <div class="tag-row" id="tag-filter-row"></div>
    <div id="card-grid"></div>
  </div>

  <!-- DETAIL -->
  <div id="view-detail" class="view">
    <div class="detail-card" id="detail-content"></div>
  </div>

  <!-- ADD/EDIT -->
  <div id="view-add" class="view">
    <div class="form-card">
      <div class="form-title" id="form-title">＋ 新しいレシピ</div>
      <label>料理名 <span class="required">*</span></label>
      <input type="text" id="f-name" placeholder="例：肉じゃが" oninput="checkSave()">
      <label>参考サイトのURL</label>
      <input type="url" id="f-url" placeholder="https://...">
      <label>メモ・レシピ</label>
      <textarea id="f-memo" rows="6" placeholder="作り方のポイントや材料など…"></textarea>
      <label>タグ</label>
      <div class="tag-select-row" id="tag-select-row"></div>
      <button id="save-btn" onclick="saveRecipe()" disabled>保存する ✓</button>
    </div>
  </div>
</main>

<script>
const TAGS = ["和食","洋食","中華","パスタ","煮物","炒め物","スープ","スイーツ","お弁当"];
const SAMPLE = [
  { id:1, name:"肉じゃが", url:"https://cookpad.com/", memo:"じゃがいもは大きめに切る。甘めが好きなら砂糖を少し増やす。", tags:["和食","煮物"], createdAt:"2026-05-10" },
  { id:2, name:"レモンパスタ", url:"https://kurashiru.com/", memo:"レモンの皮ごと使うと香り良い。仕上げにパルメザンをたっぷり。", tags:["洋食","パスタ"], createdAt:"2026-05-18" },
];

let recipes = [];
let currentView = "list";
let selectedId = null;
let editMode = false;
let selectedTags = [];
let filterTag = "";

// Storage
function load() {
  try { const s = localStorage.getItem("mom_recipes"); recipes = s ? JSON.parse(s) : [...SAMPLE]; }
  catch { recipes = [...SAMPLE]; }
}
function save() {
  try { localStorage.setItem("mom_recipes", JSON.stringify(recipes)); } catch {}
}

// Toast
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 2500);
}

// View switching
function showView(v) {
  document.querySelectorAll(".view").forEach(el => el.classList.remove("active"));
  document.getElementById("view-" + v).classList.add("active");
  currentView = v;
  document.getElementById("back-btn").style.display = v === "list" ? "none" : "flex";
  document.getElementById("add-btn").style.display = v === "list" ? "block" : "none";
}

function goBack() {
  if (currentView === "add" && editMode) showView("detail");
  else showView("list");
}

// Format date
function fmt(s) {
  const d = new Date(s);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

// Render tag filter
function renderTagFilter() {
  const row = document.getElementById("tag-filter-row");
  row.innerHTML = `<button class="tag-chip${filterTag===''?' active':''}" onclick="setFilter('')">すべて</button>`;
  TAGS.forEach(t => {
    row.innerHTML += `<button class="tag-chip${filterTag===t?' active':''}" onclick="setFilter('${t}')">${t}</button>`;
  });
}
function setFilter(t) { filterTag = filterTag === t ? "" : t; renderTagFilter(); renderList(); }

// Render list
function renderList() {
  const q = document.getElementById("search-input").value;
  const filtered = recipes.filter(r => {
    const ms = r.name.includes(q) || (r.memo||"").includes(q);
    const mt = filterTag ? (r.tags||[]).includes(filterTag) : true;
    return ms && mt;
  });
  const grid = document.getElementById("card-grid");
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty"><p style="font-size:48px">🍽️</p><p>まだレシピがありません</p></div>`;
    return;
  }
  grid.innerHTML = filtered.map(r => `
    <div class="card" onclick="openDetail(${r.id})">
      <div class="card-emoji">🍴</div>
      <div class="card-body">
        <div class="card-name">${esc(r.name)}</div>
        ${r.tags?.length ? `<div class="card-tags">${r.tags.map(t=>`<span class="tag-badge">${t}</span>`).join("")}</div>` : ""}
        ${r.memo ? `<div class="card-memo">${esc(r.memo.slice(0,50))}${r.memo.length>50?"…":""}</div>` : ""}
        <div class="card-date">${fmt(r.createdAt)}</div>
      </div>
      <div class="card-arrow">›</div>
    </div>`).join("");
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// Detail
function openDetail(id) {
  selectedId = id;
  renderDetail();
  showView("detail");
}
function renderDetail() {
  const r = recipes.find(x => x.id === selectedId);
  if (!r) return;
  document.getElementById("detail-content").innerHTML = `
    <span class="detail-emoji">🍴</span>
    <div class="detail-name">${esc(r.name)}</div>
    ${r.tags?.length ? `<div class="detail-tags">${r.tags.map(t=>`<span class="tag-badge">${t}</span>`).join("")}</div>` : ""}
    ${r.url ? `<div class="detail-section"><div class="detail-label">📎 参考サイト</div><a href="${esc(r.url)}" target="_blank" rel="noopener" class="detail-link">${esc(r.url)}</a></div>` : ""}
    ${r.memo ? `<div class="detail-section"><div class="detail-label">📝 メモ・レシピ</div><div class="detail-memo">${esc(r.memo)}</div></div>` : ""}
    <div class="detail-date">登録日：${fmt(r.createdAt)}</div>
    <div class="detail-actions">
      <button class="edit-btn" onclick="openEdit()">✏️ 編集</button>
      <button class="delete-btn" onclick="deleteRecipe()">🗑️ 削除</button>
    </div>`;
}

// Add
function openAdd() {
  editMode = false;
  selectedTags = [];
  document.getElementById("f-name").value = "";
  document.getElementById("f-url").value = "";
  document.getElementById("f-memo").value = "";
  document.getElementById("form-title").textContent = "＋ 新しいレシピ";
  document.getElementById("save-btn").textContent = "保存する ✓";
  renderTagSelect();
  checkSave();
  showView("add");
}

// Edit
function openEdit() {
  const r = recipes.find(x => x.id === selectedId);
  if (!r) return;
  editMode = true;
  selectedTags = [...(r.tags||[])];
  document.getElementById("f-name").value = r.name;
  document.getElementById("f-url").value = r.url||"";
  document.getElementById("f-memo").value = r.memo||"";
  document.getElementById("form-title").textContent = "✏️ 編集";
  document.getElementById("save-btn").textContent = "更新する ✓";
  renderTagSelect();
  checkSave();
  showView("add");
}

function renderTagSelect() {
  const row = document.getElementById("tag-select-row");
  row.innerHTML = TAGS.map(t =>
    `<button class="tag-chip${selectedTags.includes(t)?' active':''}" onclick="toggleTag('${t}')">${t}</button>`
  ).join("");
}
function toggleTag(t) {
  selectedTags = selectedTags.includes(t) ? selectedTags.filter(x=>x!==t) : [...selectedTags, t];
  renderTagSelect();
}
function checkSave() {
  document.getElementById("save-btn").disabled = !document.getElementById("f-name").value.trim();
}

function saveRecipe() {
  const name = document.getElementById("f-name").value.trim();
  if (!name) return;
  const url = document.getElementById("f-url").value.trim();
  const memo = document.getElementById("f-memo").value.trim();
  if (editMode) {
    recipes = recipes.map(r => r.id === selectedId ? { ...r, name, url, memo, tags:[...selectedTags] } : r);
    save(); showToast("更新しました ✓"); renderDetail(); showView("detail");
  } else {
    const r = { id: Date.now(), name, url, memo, tags:[...selectedTags], createdAt: new Date().toISOString().slice(0,10) };
    recipes = [r, ...recipes];
    save(); showToast("追加しました ✓"); renderList(); showView("list");
  }
}

function deleteRecipe() {
  if (!confirm(`「${recipes.find(x=>x.id===selectedId)?.name}」を削除しますか？`)) return;
  recipes = recipes.filter(r => r.id !== selectedId);
  save(); showToast("削除しました"); renderList(); showView("list");
}

// Init
load();
renderTagFilter();
renderList();
</script>
</body>
</html>
